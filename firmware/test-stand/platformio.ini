; Scoudouc 0 thrust stand firmware (ESP32-S3 N16R8 dev board).
; Build/upload:  pio run -t upload     Watch output:  pio device monitor
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; N16R8 = 16 MB flash + 8 MB octal PSRAM. Octal PSRAM uses GPIO 35-37, so we never touch them.
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
; Serial goes over the board's USB port (the one labelled USB, not UART).
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bogde/HX711@^0.7.5
